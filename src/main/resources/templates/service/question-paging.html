<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>techsupp 고객센터</title>
    <div th:replace="/head_css :: head_css"></div>
    <link rel="stylesheet" href="/style/service/question-paging.css"/>
</head>
<body>
<div th:replace="/header :: header"></div>
<div th:insert="/service/service-header :: service-header"></div>

<div class="align-form">
    <form id="listForm">
        <div class="container-fluid px-3">
            <div class="card mb-4">
                <div class="card-body">
                    <table class="table" id="result">
                        <thead id="question-head">
                        <tr>
                            <th scope="col" colspan="2">문의내역</th>
                            <th scope="col">작성자</th>
                            <th scope="col">날짜</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="question: ${questionList}">
                            <!--                            <td th:text="${question.questionId}"></td>  -->
                            <td>
                                <span id="answerStatus" th:text="${question.questionStatus.getAnswer()}"></span>
                            </td>
                            <td>
                                <a th:href="@{|/notice/question-check/${question.questionId}|(page=${questionList.number + 1})}"
                                   th:text="${question.questionTitle}"></a>
                            </td>
                            <td th:text="${question.questionWriter}"></td>
                            <td th:text="${question.getFormattedCreatedAtQ}"></td>
                            <!--                    <td th:text="${question.questionStatus}"></td>-->
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="question-btn-w">
                <button id="question-btn" onclick="pagingReq()"><a href="/cs/question">문의작성</a></button>
            </div>

            <div class="align-form">
                <div id="pagingForm">
                    <!-- 첫번째 페이지로 이동 -->
                    <!-- /board/paging?page=1 -->
                    <a class="top-link" th:href="@{/notice/question-paging(page=1)}">First</a>
                    <!-- 이전 링크 활성화 비활성화 -->
                    <!-- boardList.getNumber() 사용자:2페이지 getNumber()=1 -->
                    <a class="link" th:href="${questionList.first} ? '#' : @{/notice/question-paging(page=${questionList.number})}">prev</a>

                    <!-- 페이지 번호 링크(현재 페이지는 숫자만) for(int page=startPage; page<=endPage; page++)-->
                    <span th:each="page: ${#numbers.sequence(startPage, endPage)}">
                        <!-- 현재페이지는 링크 없이 숫자만 -->
                        <span th:if="${page == questionList.number + 1}" th:text="${page}"></span>
                        <!-- 현재페이지 번호가 아닌 다른 페이지번호에는 링크를 보여줌 -->
                        <span th:unless="${page == questionList.number + 1}">
                            <a th:href="@{/notice/question-paging(page=${page})}" th:text="${page}"></a>
                        </span>
                    </span>

                    <!-- 다음 링크 활성화 비활성화 사용자: 2페이지, getNumber: 1, 3페이지-->
                    <a class="link" th:href="${questionList.last} ? '#' : @{/notice/question-paging(page=${questionList.number + 2})}">next</a>
                    <!-- 마지막 페이지로 이동 -->
                    <a class="top-link" th:href="@{/notice/question-paging(page=${questionList.totalPages})}">Last</a>
                </div>
            </div>
        </div>
    </form>
</div>
<script src="/script/service/userNotice.js"></script>
</body>
</html>
